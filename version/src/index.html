<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bóveda de Apps HTML</title>
    <style>
        * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
        body { margin: 0; background: #0f172a; color: #f8fafc; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        header { background: #1e293b; padding: 12px 16px; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
        header h1 { margin: 0; font-size: 1.1rem; color: #38bdf8; }

        .main-container { display: flex; flex: 1; overflow: hidden; }
        @media (max-width: 768px) { .main-container { flex-direction: column; } }

        #sidebar { width: 100%; max-width: 400px; background: #1e293b; border-right: 1px solid #334155; display: flex; flex-direction: column; }
        @media (max-width: 768px) { #sidebar { max-width: 100%; height: 50%; } }

        .sidebar-actions { padding: 12px; background: #0f172a; border-bottom: 1px solid #334155; display: flex; gap: 8px; }
        .btn-rescatar { background: #0284c7; color: white; border: none; padding: 10px 14px; border-radius: 6px; font-weight: bold; cursor: pointer; flex: 1; text-align: center; font-size: 0.9rem; }
        .btn-rescatar:active { background: #0369a1; }

        #lista-versiones { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }

        .card { background: #334155; padding: 12px; border-radius: 8px; border: 1px solid #475569; cursor: pointer; transition: 0.2s; }
        .card:hover { border-color: #38bdf8; }
        .card h4 { margin: 0 0 4px 0; color: #38bdf8; font-size: 1rem; }
        .card p { margin: 0 0 8px 0; font-size: 0.8rem; color: #94a3b8; }
        .card-footer { display: flex; justify-content: space-between; align-items: center; font-size: 0.75rem; color: #64748b; }

        #preview { flex: 1; display: flex; flex-direction: column; background: #ffffff; }
        .preview-header { background: #f1f5f9; color: #334155; padding: 8px 16px; font-size: 0.85rem; font-weight: bold; border-bottom: 1px solid #cbd5e1; display: flex; justify-content: space-between; align-items: center; }
        iframe { width: 100%; height: 100%; border: none; flex: 1; }

        #modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); justify-content: center; align-items: center; padding: 20px; z-index: 10; }
        .modal-content { background: #1e293b; padding: 20px; border-radius: 10px; width: 100%; max-width: 400px; border: 1px solid #475569; display: flex; flex-direction: column; gap: 12px; }
        .modal-content input, .modal-content textarea { width: 100%; background: #0f172a; border: 1px solid #475569; color: white; padding: 10px; border-radius: 6px; font-size: 0.9rem; }
        .modal-content button { background: #10b981; color: white; border: none; padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <header>
        <h1>📦 Bóveda de Apps HTML</h1>
        <span id="contador-apps" style="font-size: 0.8rem; color: #94a3b8;">0 guardadas</span>
    </header>

    <div class="main-container">
        <div id="sidebar">
            <div class="sidebar-actions">
                <input type="file" id="fileInput" accept=".html" style="display: none;" onchange="procesarArchivoRescatado(event)">
                <button class="btn-rescatar" onclick="document.getElementById('fileInput').click()">📂 Rescatar archivo borrado</button>
            </div>
            <div id="lista-versiones">
                <p style="text-align: center; color: #64748b; font-size: 0.85rem; margin-top: 20px;">No hay versiones en la bóveda.<br>Usa el botón superior para importar un HTML.</p>
            </div>
        </div>

        <div id="preview">
            <div class="preview-header">
                <span id="titulo-preview">Selecciona una versión para probarla</span>
                <button onclick="copiarCodigoActual()" id="btnCopiar" style="display:none; background: #334155; color: white; border: none; padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; cursor: pointer;">Copiar Código</button>
            </div>
            <iframe id="visor_html" src="about:blank"></iframe>
        </div>
    </div>

    <div id="modal">
        <div class="modal-content">
            <h3 style="margin: 0; color: #38bdf8;">Registrar Versión</h3>
            <p style="margin: 0; font-size: 0.8rem; color: #94a3b8;" id="nombre-archivo-subido"></p>
            <input type="text" id="inputNombre" placeholder="Nombre de la app o versión">
            <textarea id="inputDescripcion" rows="3" placeholder="¿Qué funciona en esta versión? (Ej: Versión con diseño responsivo y sin errores en JS)"></textarea>
            <button onclick="guardarEnBoveda()">Guardar en la Bóveda</button>
            <button onclick="cerrarModal()" style="background: #475569;">Cancelar</button>
        </div>
    </div>

    <script>
        let db;
        let codigoTemporal = "";
        let nombreTemporal = "";

        const request = indexedDB.open("BovedaAppsDB", 1);
        request.onerror = () => alert("Error al abrir la base de datos local.");
        request.onsuccess = (e) => {
            db = e.target.result;
            cargarLista();
        };
        request.onupgradeneeded = (e) => {
            db = e.target.result;
            const store = db.createObjectStore("versiones", { keyPath: "id", autoIncrement: true });
            store.createIndex("fecha", "fecha", { unique: false });
        };

        function procesarArchivoRescatado(event) {
            const file = event.target.files[0];
            if (!file) return;

            nombreTemporal = file.name;
            const reader = new FileReader();
            reader.onload = function(e) {
                codigoTemporal = e.target.result;
                document.getElementById('nombre-archivo-subido').innerText = `Archivo: ${nombreTemporal}`;
                document.getElementById('inputNombre').value = nombreTemporal.replace('.html', '');
                document.getElementById('inputDescripcion').value = '';
                document.getElementById('modal').style.display = 'flex';
            };
            reader.readAsText(file);
            event.target.value = '';
        }

        function cerrarModal() {
            document.getElementById('modal').style.display = 'none';
        }

        function guardarEnBoveda() {
            const nombre = document.getElementById('inputNombre').value || nombreTemporal;
            const descripcion = document.getElementById('inputDescripcion').value || "Sin descripción";
            
            const transaccion = db.transaction(["versiones"], "readwrite");
            const store = transaccion.objectStore("versiones");
            
            const nuevaVersion = {
                nombre,
                descripcion,
                codigo: codigoTemporal,
                fecha: new Date().toLocaleDateString() + ' ' + new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})
            };

            store.add(nuevaVersion);
            transaccion.oncomplete = () => {
                cerrarModal();
                cargarLista();
            };
        }

        function cargarLista() {
            const contenedor = document.getElementById('lista-versiones');
            contenedor.innerHTML = '';
            
            const store = db.transaction("versiones", "readonly").objectStore("versiones");
            const request = store.getAll();

            request.onsuccess = () => {
                const versiones = request.result;
                document.getElementById('contador-apps').innerText = `${versiones.length} guardadas`;

                if (versiones.length === 0) {
                    contenedor.innerHTML = `<p style="text-align: center; color: #64748b; font-size: 0.85rem; margin-top: 20px;">No hay versiones en la bóveda.<br>Usa el botón superior para importar un HTML.</p>`;
                    return;
                }

                versiones.reverse().forEach(v => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <h4>${v.nombre}</h4>
                        <p>${v.descripcion}</p>
                        <div class="card-footer">
                            <span>📅 ${v.fecha}</span>
                            <span style="color: #38bdf8; font-weight: bold;">Probar ▶</span>
                        </div>
                    `;
                    card.onclick = () => probarApp(v.codigo, v.nombre);
                    contenedor.appendChild(card);
                });
            };
        }

        let codigoSeleccionadoActual = "";
        function probarApp(codigoHTML, nombre) {
            codigoSeleccionadoActual = codigoHTML;
            document.getElementById('titulo-preview').innerText = `Ejecutando: ${nombre}`;
            document.getElementById('btnCopiar').style.display = 'block';

            const blob = new Blob([codigoHTML], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            document.getElementById('visor_html').src = url;
        }

        function copiarCodigoActual() {
            navigator.clipboard.writeText(codigoSeleccionadoActual).then(() => {
                alert("¡Código HTML copiado al portapapeles!");
            });
        }
    </script>
</body>
</html>
