name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      
      - name: Instalar dependencias
        run: npm install

      - name: Compilar y empaquetar
        run: npm run make
        
      - name: Subir instalador
        uses: actions/upload-artifact@v4
        with:
          name: filtrador-windows-setup
          path: out/make/**/*.exe
